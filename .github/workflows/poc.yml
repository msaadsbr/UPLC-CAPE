name: PoC Verification Bypass

on:
  pull_request:
  workflow_dispatch:

jobs:
  poc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            accept-flake-config = true

      - uses: cachix/cachix-action@v17
        with:
          name: uplc-cape

      - name: Build measure executable
        run: nix build .#measure --accept-flake-config -o result

      - name: Verify malicious submission only
        run: |
          nix develop --accept-flake-config --command bash -c 'export PATH="$PWD/result/bin:$PATH" && CAPE_VERBOSE=1 cape submission verify submissions/fibonacci/BadCompiler_1.0_attacker'
